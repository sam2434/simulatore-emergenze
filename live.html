<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔴 Missioni live — Simulatore Emergenze</title>
<meta name="description" content="Missioni in corso del Simulatore Emergenze, aggiornate in tempo reale. Pagina pubblica di sola lettura.">
<style>
  :root{
    --areu:#004898; --areu-dark:#003a75;
    --bg:#dfe6ec; --card:#ffffff; --txt:#1a1a1a; --mut:#5a6b7c;
    --red:#d52b1e; --yel:#f5a800; --grn:#2e8b57; --link:#0b5cc0;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt);
    font-family:"Roboto","Segoe UI",system-ui,Arial,sans-serif; }
  /* ===== Header stile AREU ===== */
  header{ position:sticky; top:0; z-index:10; background:var(--areu); color:#fff;
    padding:10px 14px; box-shadow:0 2px 6px #0005; }
  .wrap{ max-width:1100px; margin:0 auto; }
  .bar{ display:flex; align-items:center; gap:12px; }
  .hamb{ font-size:24px; background:none; border:0; color:#fff; cursor:pointer; padding:2px 6px; }
  .logo{ display:flex; align-items:center; gap:10px; flex:1; }
  .logo .ast{ font-size:30px; font-weight:900; line-height:1; }
  .logo .name{ font-size:30px; font-weight:800; letter-spacing:2px; }
  .logo .agenzia{ font-size:11px; line-height:1.25; border-left:1px solid #ffffff88; padding-left:10px; }
  .searchbtn{ font-size:22px; background:none; border:0; color:#fff; cursor:pointer; padding:2px 6px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .toolbar input,.toolbar select{ background:#fff; color:var(--txt);
    border:1px solid #ffffff66; border-radius:6px; padding:8px 10px; font-size:14px; }
  .toolbar input{ flex:1 1 200px; }
  /* ===== Lista missioni ===== */
  main{ padding:10px; }
  #statoRiga{ color:var(--mut); font-size:12px; margin:2px 2px 8px; }
  #conto{ font-weight:700; }
  .card{ background:var(--card); border-radius:4px; padding:10px 12px 10px 12px;
    margin-bottom:10px; box-shadow:0 1px 3px #0003; display:flex; gap:10px; }
  .badge{ flex:none; width:30px; height:30px; border-radius:50%; margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900; color:#fff; }
  .badge.cod-ROSSO{ background:var(--red); }
  .badge.cod-GIALLO{ background:var(--yel); }
  .badge.cod-VERDE{ background:var(--grn); }
  .badge.cod-BIANCO{ background:#9aa7b2; }
  .badge.cod-SENZA{ background:#6b7884; }
  .cardBody{ flex:1; min-width:0; font-size:14px; line-height:1.45; }
  .rigaTitolo{ font-weight:700; }
  .rigaTitolo .via{ color:var(--link); text-decoration:underline; font-weight:400; }
  .rigaEnti{ color:var(--mut); font-size:13px; margin-top:2px; }
  .rigaStato{ margin-top:4px; font-size:12px; color:var(--mut); }
  .rigaStato b{ color:var(--txt); }
  .mezzi{ margin:6px 0 0; border-top:1px solid #e3e9ee; }
  .mz{ display:flex; align-items:center; gap:8px; padding:5px 0;
    border-bottom:1px solid #eef2f5; font-size:13px; }
  .mz:last-child{ border-bottom:0; }
  .mz .amb{ font-size:19px; }
  .mz .nome{ font-weight:700; }
  .mz .tipo{ font-size:11px; font-weight:800; padding:0 6px; border-radius:10px;
    background:#eef2f5; color:var(--mut); white-space:nowrap; }
  .mz .tipo.msb{ background:#e3ecfb; color:#0645ad; }
  .mz .tipo.msa{ background:#fde7e5; color:#d00000; }
  .mz .tipo.vvf{ background:#e4eaee; color:#4d5862; }
  .mz .trDot{ display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; font-size:10px; font-weight:900;
    color:#fff; flex:none; }
  .mz .trDot.ROSSO{ background:var(--red); }
  .mz .trDot.GIALLO{ background:var(--yel); }
  .mz .trDot.VERDE{ background:var(--grn); }
  .mz .trDot.BIANCO{ background:#9aa7b2; }
  .mz .cod{ color:var(--mut); font-family:monospace; font-size:12px; }
  .mz .st{ margin-left:auto; font-size:11px; font-weight:700; white-space:nowrap; }
  .mz .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  .stato-pill{ display:inline-block; font-size:11px; font-weight:700; padding:1px 8px;
    border-radius:12px; margin-left:6px; vertical-align:middle; }
  .stato-pill.attiva{ background:#fde7e5; color:var(--red); }
  .stato-pill.in_corso{ background:#fef3d8; color:#8a6100; }
  .stato-pill.chiusa{ background:#e4eaee; color:var(--mut); }
  .centro{ text-align:center; color:var(--mut); padding:40px 10px; font-size:15px; }
  .errore{ background:#fde7e5; border:1px solid var(--red); border-radius:6px;
    padding:14px; margin-bottom:10px; font-size:14px; }
.errore button{ background:var(--areu); color:#fff; border:0; border-radius:6px;
    padding:8px 16px; font-size:14px; cursor:pointer; margin-top:8px; }
  .errore ol{ margin:8px 0 8px 20px; padding:0; }
  .errore li{ margin:4px 0; }
  .errore details{ margin-top:8px; font-size:13px; }
  .errore code{ display:block; margin-top:4px; padding:8px; background:#fff;
    border:1px solid #e3b7b4; border-radius:6px; word-break:break-all; }
  .setup{ margin-top:10px; background:#fff; border:1px solid #c9d4de;
    border-radius:6px; padding:10px; color:var(--txt); }
  .setup label{ display:block; font-size:13px; font-weight:700; margin:8px 0 4px; }
  .setup input{ width:100%; border:1px solid #9fb0bf; border-radius:6px;
    padding:8px 10px; font-size:14px; }
  .setup .riga{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .setup .nota{ font-size:12px; color:var(--mut); margin-top:8px; }
  .setup .stato{ font-size:13px; margin-top:8px; min-height:18px; }
footer{ color:var(--mut); font-size:12px; text-align:center; padding:20px; }
  footer a{ color:var(--link); }
  .spinner{ width:34px; height:34px; border:4px solid #b9c6d2; border-top-color:var(--areu);
    border-radius:50%; margin:30px auto 10px; animation:gira 0.9s linear infinite; }
  @keyframes gira{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <button class="hamb" id="hambBtn" title="Menu">☰</button>
      <div class="logo">
        <span class="ast">✳</span><span class="name">AREU</span>
        <span class="agenzia">Agenzia<br>Regionale<br>Emergenza<br>Urgenza</span>
      </div>
      <button class="searchbtn" id="searchBtn" title="Cerca">🔍</button>
    </div>
    <div class="toolbar" id="toolbar">
      <input id="cerca" type="search" placeholder="🔍 Cerca tipologia, luogo, comune…" autocomplete="off">
      <select id="filtroStato">
        <option value="attive">Aperte (attive + in corso)</option>
        <option value="tutte">Tutte (incluse chiuse)</option>
        <option value="attiva">Solo attive</option>
        <option value="in_corso">Solo in corso</option>
        <option value="chiusa">Solo chiuse</option>
      </select>
      <button id="cfgBtn" type="button" title="Configura connessione">⚙️ Connessione</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="statoRiga">Connessione in corso… <span id="conto"></span></div>
  <div id="errBox" class="errore" hidden></div>
  <div id="caricamento"><div class="spinner"></div><div class="centro">Caricamento missioni…</div></div>
  <div id="griglia"></div>
  <div id="vuoto" class="centro" hidden>Nessuna missione pubblicata al momento. 🚑</div>
</main>
<footer>Solo lettura — i dati si aggiornano da soli. <a href="index.html">Apri il simulatore</a></footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  // >>>>>>>>>>> CONFIG — INCOLLA QUI I TUOI 2 VALORI (gli stessi del simulatore) >>>>>>>>>>>
  var SUPABASE_URL = "https://INSERISCI-IL-TUO-PROJECT-URL.supabase.co";
  var SUPABASE_ANON_KEY = "INCOLLA-QUI-LA-TUA-PUBLISHABLE-KEY";
  // >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
  // Usa SOLO Project URL + Publishable key. MAI password o chiavi riservate.

  var POLL_MS = 20000, LIMITE = 100;
  var righe = [], canale = null, client = null, pronte = false;

  var LS_CFG = "coeulive_config"; // configurazione solo su questo browser

  function leggiCfgSalvata(){
    try{
      var cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null");
      if(cfg && typeof cfg.url === "string" && typeof cfg.key === "string"){
        return { url: cfg.url, key: cfg.key };
      }
    }catch(_){}
    return { url: "", key: "" };
  }

  function salvaCfg(url, key){
    try{ localStorage.setItem(LS_CFG, JSON.stringify({ url: url, key: key })); }
    catch(_){}
  }

  function pulisciCfg(){
    try{ localStorage.removeItem(LS_CFG); }
    catch(_){}
  }

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function statoIT(s){
    return s === "attiva" ? "ATTIVA" : s === "in_corso" ? "IN CORSO" : s === "chiusa" ? "CHIUSA" : String(s).toUpperCase();
  }
  function oraHM(ts){
    try{
      var d = new Date(ts);
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }catch(_){ return "--:--"; }
  }
  function quando(ts){
    try{
      var d = new Date(ts), now = new Date(), diff = Math.max(0, now - d);
      var m = Math.floor(diff / 60000);
      if(m < 1) return "adesso";
      if(m < 60) return m + " min fa";
      if(d.toDateString() === now.toDateString()) return "oggi " + oraHM(ts);
      return d.toLocaleDateString("it-IT") + " " + oraHM(ts);
    }catch(_){ return ""; }
  }

  function urlPulita(){
    var u = String(SUPABASE_URL || "").trim();
    while(u.slice(-1) === "/") u = u.slice(0, -1);
    return u;
  }

  function hostContattato(){
    try{ return new URL(urlPulita()).hostname; }
    catch(_){ return ""; }
  }

  function erroreDiRete(msg){
    var t = String(msg || "");
    return t.indexOf("Failed to fetch") >= 0 ||
      t.indexOf("NetworkError") >= 0 ||
      t.indexOf("Load failed") >= 0 ||
      t.indexOf("ERR_") >= 0;
  }

  function statoMezzoIT(s){
    var m = { viaggio:"IN VIAGGIO", sul_posto:"SUL POSTO", pronto:"PRONTO",
      trasporto:"TRASPORTO", ospedale:"IN PS", rientro:"RIENTRO",
      disponibile:"LIBERO", fuori_servizio:"FUORI SERVIZIO" };
    return m[s] || String(s || "?").toUpperCase();
  }
  function dotMezzo(s){
    if(s === "sul_posto" || s === "pronto" || s === "trasporto") return "#d52b1e";
    if(s === "viaggio") return "#f5a800";
    if(s === "ospedale") return "#7a00c0";
    return "#9aa7b2";
  }
  function trasportoDaCodice(cod){
    if(cod === "ROSSO") return "R";
    if(cod === "GIALLO") return "G";
    if(cod === "VERDE") return "V";
    if(cod === "BIANCO") return "B";
    return "";
  }
  function iconaMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    var cat = String((v && v.cat) || "").toUpperCase();
    if(t === "ELI") return "🚁";
    if(cat === "VVF") return "🚒";
    if(t === "MSB" || t === "MSA") return "🚑";
    if(t === "AUTOMEDICA") return "🚓";
    return (v && v.tr) ? "🚑" : "🚓";
  }
  function tipoMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    if(t) return t;
    var cat = String((v && v.cat) || "").toUpperCase();
    if(cat === "VVF") return "VVF";
    if(cat === "AMBULANZA") return "MSB";
    if(cat === "MSI_MSA") return "MSA";
    return "?";
  }
  function classeTipoMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    if(t === "MSB") return "msb";
    if(t === "MSA" || t === "AUTOMEDICA" || t === "ELI") return "msa";
    if(String((v && v.cat) || "").toUpperCase() === "VVF") return "vvf";
    return "";
  }
  function mezziHTML(mz, cod){
    var arr = [];
    if(Array.isArray(mz)) arr = mz;
    else { try{ arr = JSON.parse(mz || "[]"); }catch(_){ arr = []; } }
    if(!arr.length) return "";
    var trCod = trasportoDaCodice(cod);
    return '<div class="mezzi">' + arr.map(function(v){
      var inTrasporto = v.s === "trasporto" || v.s === "ospedale";
      return '<div class="mz"><span class="amb">' + iconaMezzo(v) + "</span>" +
        '<span class="nome">' + esc(v.n || "?") + '</span>' +
        '<span class="tipo ' + classeTipoMezzo(v) + '">' + esc(tipoMezzo(v)) + "</span>" +
        ((v.tr && trCod && inTrasporto) ? '<span class="trDot ' + cod + '" title="Codice di trasporto: ' + esc(String(cod || "").toUpperCase()) + '">' + trCod + "</span>" : "") +
        ((v.c && v.c !== v.n) ? '<span class="cod">' + esc(v.c) + "</span>" : "") +
        '<span class="st"><span class="dot" style="background:' + dotMezzo(v.s) + '"></span>' +
        esc(statoMezzoIT(v.s)) + "</span></div>";
    }).join("") + "</div>";
  }

  function disegna(){
    var q = ($("cerca").value || "").toLowerCase();
    var f = $("filtroStato").value;
    var vis = righe.filter(function(r){
      if(f === "attive" && !(r.stato === "attiva" || r.stato === "in_corso")) return false;
      if(f !== "attive" && f !== "tutte" && r.stato !== f) return false;
      if(!q) return true;
      return ((r.tipologia || "") + " " + (r.localita || "") + " " + (r.comune || "")).toLowerCase().indexOf(q) >= 0;
    });
    var aperte = righe.filter(function(r){ return r.stato === "attiva" || r.stato === "in_corso"; }).length;
    $("conto").textContent = "· " + aperte + " aperte · aggiornato " + new Date().toLocaleTimeString("it-IT");
    $("vuoto").hidden = vis.length > 0;
    $("griglia").innerHTML = vis.map(function(r){
      var st = r.stato === "in_corso" ? "in_corso" : r.stato;
      var luogo = (r.comune || "").toUpperCase() + (r.provincia ? " (" + esc(r.provincia) + ")" : "");
      var via = esc(r.localita || "?");
      var cod = String(r.codice || "SENZA CODICE").toUpperCase();
      var codCls = ["ROSSO","GIALLO","VERDE","BIANCO"].indexOf(cod) >= 0 ? cod : "SENZA";
      return '<article class="card">' +
        '<div class="badge cod-' + codCls + '" title="Codice di invio: ' + esc(cod) + '">✳</div>' +
        '<div class="cardBody">' +
        '<div class="rigaTitolo">' + esc(oraHM(r.updated_at)) + " " + esc(luogo) + " - " + esc((r.tipologia || "?").toUpperCase()) + ' - <span class="via">' + via + "</span>" +
        '<span class="stato-pill ' + esc(st) + '">' + esc(statoIT(r.stato)) + "</span></div>" +
        mezziHTML(r.mezzi, codCls === "SENZA" ? "SENZA CODICE" : codCls) +
        '<div class="rigaEnti">🕐 ' + esc(quando(r.updated_at)) + " · #" + esc(r.missione_id) + "</div>" +
        "</div></article>";
    }).join("");
  }

  function mostraErrore(msg, riprova){
    var b = $("errBox");
    b.hidden = false;
    b.innerHTML = "⚠️ <b>Problema di connessione.</b><br>" + esc(msg) +
      (riprova ? '<br><button id="riprovaBtn">🔄 Riprova ora</button>' : "");
    var btn = $("riprovaBtn");
    if(btn) btn.onclick = function(){ b.hidden = true; ricarica(); };
  }

  function mostraSetup(){
    var b = $("errBox");
    var salvata = leggiCfgSalvata();
    var urlIn = salvata.url ||
      (SUPABASE_URL.indexOf("INSERISCI-IL-TUO") < 0 ? SUPABASE_URL : "");
    var keyIn = salvata.key ||
      (SUPABASE_ANON_KEY.indexOf("INCOLLA-QUI") < 0 ? SUPABASE_ANON_KEY : "");
    b.hidden = false;
    b.innerHTML = "⚠️ <b>Connessione da configurare su questo browser.</b><br>" +
      "Incolla qui i due valori del tuo progetto Supabase. Restano salvati solo su questo dispositivo." +
      '<div class="setup">' +
      '<label for="cfgUrl">Project URL</label>' +
      '<input id="cfgUrl" type="text" autocomplete="off" spellcheck="false" placeholder="https://xxxx.supabase.co">' +
      '<label for="cfgKey">Publishable key</label>' +
      '<input id="cfgKey" type="password" autocomplete="off" spellcheck="false" placeholder="sb_publishable_...">' +
      '<div class="riga"><button id="cfgSaveBtn" type="button">💾 Salva e connetti</button>' +
      '<button id="cfgClearBtn" type="button">🧹 Cancella</button></div>' +
      '<div class="stato" id="cfgStato"></div>' +
      '<div class="nota">Non usare password né chiavi che iniziano con <b>sb_secret_</b>.</div>' +
      "</div>";
    var urlEl = $("cfgUrl"), keyEl = $("cfgKey"), statoEl = $("cfgStato");
    urlEl.value = urlIn;
    keyEl.value = keyIn;
    $("cfgSaveBtn").onclick = function(){
      var url = String(urlEl.value || "").trim();
      while(url.slice(-1) === "/") url = url.slice(0, -1);
      var key = String(keyEl.value || "").trim();
      if(!url || !key){
        statoEl.textContent = "Inserisci entrambi i valori e riprova.";
        return;
      }
      if(url.indexOf("sb_secret_") >= 0 || key.indexOf("sb_secret_") === 0){
        statoEl.textContent = "Hai incollato una chiave riservata sb_secret_: usa la Publishable key.";
        return;
      }
      try{
        var u = new URL(url);
        if(u.protocol !== "https:" || u.hostname.toLowerCase().indexOf(".supabase.co") < 0){
          throw new Error("URL non valido");
        }
      }catch(_){
        statoEl.textContent = "Project URL non valido: deve essere https://xxxx.supabase.co.";
        return;
      }
      salvaCfg(url, key);
      statoEl.textContent = "Salvato. Connessione in corso…";
      b.hidden = true;
      avvia();
    };
    $("cfgClearBtn").onclick = function(){
      pulisciCfg();
      urlEl.value = "";
      keyEl.value = "";
      statoEl.textContent = "Configurazione cancellata da questo browser.";
    };
  }

  function mostraErroreRete(msg){
    var b = $("errBox");
    var host = hostContattato();
    var hostTxt = host ? esc(host) : "l’indirizzo configurato";
    var hostHref = host ? esc("https://" + host) : "#";
    b.hidden = false;
    b.innerHTML = "⚠️ <b>La pagina non riesce a raggiungere " + hostTxt + ".</b><br>" +
      "Il gioco non è toccato. Controlla questi punti, in ordine:" +
      "<ol>" +
      "<li><b>Project URL</b>: deve essere simile a <b>https://xxxx.supabase.co</b>, senza spazi, senza <b>/rest/v1</b> e senza chiavi dentro l’indirizzo.</li>" +
      "<li><b>Publishable key</b>: di solito inizia con <b>sb_publishable_</b>. Non usare mai una chiave che inizia con <b>sb_secret_</b>: è riservata e non va nel browser.</li>" +
      "<li>Apri il progetto nel browser: <a href=\"" + hostHref + "\" target=\"_blank\" rel=\"noopener\">" + hostTxt + "</a>. Se non si apre, il progetto può essere sbagliato, in pausa oppure la rete lo blocca.</li>" +
      "<li>Prova un’altra rete o un altro browser e, se usi VPN/ad-block/firewall aziendale, disattivalo per un minuto e riprova.</li>" +
      "</ol>" +
      "<details><summary>Dettaglio tecnico</summary><code>" + esc(String(msg || "errore di rete").slice(0, 300)) + "</code></details>" +
      '<br><button id="riprovaBtn">🔄 Riprova ora</button>';
    var btn = $("riprovaBtn");
    if(btn) btn.onclick = function(){ b.hidden = true; ricarica(); };
  }

  async function ricarica(){
    if(!client) return;
    try{
      var q = client.from("missioni_live")
        .select("missione_id,tipologia,localita,comune,provincia,num_pazienti,stato,codice,mezzi,updated_at")
        .eq("pubblica", true)
        .order("updated_at", { ascending: false })
        .limit(LIMITE);
      var res = await q;
      if(res.error) throw res.error;
      righe = res.data || [];
      pronte = true;
      $("caricamento").hidden = true;
      disegna();
    }catch(e){
      var msg = String((e && e.message) || e);
      $("caricamento").hidden = true;
      if(erroreDiRete(msg)) mostraErroreRete(msg);
      else mostraErrore("impossibile caricare le missioni (" + msg.slice(0, 180) + "). Il gioco non è toccato: riprova tra poco.", true);
    }
  }

  function avvia(){
    var salvata = leggiCfgSalvata();
    if(salvata.url && salvata.key){
      SUPABASE_URL = salvata.url;
      SUPABASE_ANON_KEY = salvata.key;
    }
    SUPABASE_URL = urlPulita();
    SUPABASE_ANON_KEY = String(SUPABASE_ANON_KEY || "").trim();
    if(SUPABASE_URL.indexOf("INSERISCI-IL-TUO") >= 0 || SUPABASE_ANON_KEY.indexOf("INCOLLA-QUI") >= 0){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    if(SUPABASE_URL.indexOf("sb_secret_") >= 0 || SUPABASE_ANON_KEY.indexOf("sb_secret_") === 0){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    if(!window.supabase || !window.supabase.createClient){
      $("caricamento").hidden = true;
      mostraErrore("libreria Supabase non caricata: serve la connessione a internet (unpkg.com).", true);
      return;
    }
    try{
      var u = new URL(SUPABASE_URL);
      if(u.protocol !== "https:" || u.hostname.toLowerCase().indexOf(".supabase.co") < 0){
        throw new Error("URL non valido");
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(e){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    ricarica();
    try{
      canale = client.channel("missioni-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "missioni_live" }, function(){ ricarica(); })
        .subscribe();
    }catch(_){ /* il polling sotto copre comunque gli aggiornamenti */ }
    setInterval(ricarica, POLL_MS); // rete di sicurezza se il Realtime salta
    $("cerca").addEventListener("input", disegna);
    $("filtroStato").addEventListener("change", disegna);
    $("cfgBtn").addEventListener("click", mostraSetup);
    $("searchBtn").addEventListener("click", function(){
      var t = $("toolbar");
      t.style.display = (t.style.display === "none") ? "flex" : "none";
      if(t.style.display !== "none") $("cerca").focus();
    });
    $("hambBtn").addEventListener("click", function(){
      var t = $("toolbar");
      t.style.display = (t.style.display === "none") ? "flex" : "none";
    });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", avvia);
  else avvia();
})();
</script>
</body>
</html>
