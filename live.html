<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔴 Missioni live — Simulatore Emergenze</title>
<meta name="description" content="Missioni in corso del Simulatore Emergenze, aggiornate in tempo reale. Pagina pubblica di sola lettura.">
<style>
  :root{
    --areu:#004898; --areu-dark:#003a75;
    --bg:#dfe6ec; --card:#ffffff; --txt:#1a1a1a; --mut:#5a6b7c;
    --red:#d52b1e; --yel:#f5a800; --grn:#2e8b57; --link:#0b5cc0;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt);
    font-family:"Roboto","Segoe UI",system-ui,Arial,sans-serif; }
  /* ===== Header stile AREU ===== */
  header{ position:sticky; top:0; z-index:10; background:var(--areu); color:#fff;
    padding:10px 14px; box-shadow:0 2px 6px #0005; }
  .wrap{ max-width:1100px; margin:0 auto; }
  /* ===== Layout 3 colonne (solo schermi larghi) ===== */
  .layout{ display:flex; gap:12px; align-items:flex-start; }
  .feed{ flex:1 1 auto; min-width:0; }
  .side{ flex:none; width:240px; }
  .sideR{ width:280px; }
  .pannello{ background:var(--card); border-radius:4px; padding:10px 12px;
    margin-bottom:10px; box-shadow:0 1px 3px #0003; font-size:13px; }
  .pannello h3{ margin:0 0 6px; font-size:12px; text-transform:uppercase;
    letter-spacing:.5px; color:var(--mut); }
  .pannello .riga{ display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .pannello .riga b{ font-variant-numeric:tabular-nums; }
  .pannello .leg{ color:var(--mut); font-size:12px; line-height:1.7; }
  .pannello .comp{ font-weight:700; }
  .pannello .sub{ color:var(--mut); font-size:12px; }
  @media (min-width:1280px){
    main.wrap{ max-width:1560px; }
    .side{ position:sticky; top:132px; }
  }
  @media (max-width:1279px){
    .layout{ flex-direction:column; }
    .feed{ order:-1; width:100%; }
    .side,.sideR{ width:100%; }
  }
  .bar{ display:flex; align-items:center; gap:12px; }
  .hamb{ font-size:24px; background:none; border:0; color:#fff; cursor:pointer; padding:2px 6px; }
  .logo{ display:flex; align-items:center; gap:10px; flex:1; }
  .logo .ast{ font-size:30px; font-weight:900; line-height:1; }
  .logo .name{ font-size:30px; font-weight:800; letter-spacing:2px; }
  .logo .agenzia{ font-size:11px; line-height:1.25; border-left:1px solid #ffffff88; padding-left:10px; }
  .searchbtn{ font-size:22px; background:none; border:0; color:#fff; cursor:pointer; padding:2px 6px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .toolbar input,.toolbar select{ background:#fff; color:var(--txt);
    border:1px solid #ffffff66; border-radius:6px; padding:8px 10px; font-size:14px; }
  .toolbar input{ flex:1 1 200px; }
  /* ===== Lista missioni ===== */
  main{ padding:10px; }
  #statoRiga{ color:var(--mut); font-size:12px; margin:2px 2px 8px; }
  #conto{ font-weight:700; }
  .card{ background:var(--card); border-radius:4px; padding:10px 12px 10px 12px;
    margin-bottom:10px; box-shadow:0 1px 3px #0003; display:flex; gap:10px; }
  .badge{ flex:none; width:30px; height:30px; border-radius:50%; margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900; color:#fff; }
  .badge.cod-ROSSO{ background:var(--red); }
  .badge.cod-GIALLO{ background:var(--yel); }
  .badge.cod-VERDE{ background:var(--grn); }
  .badge.cod-BIANCO{ background:#9aa7b2; }
  .badge.cod-SENZA{ background:#6b7884; }
  .cardBody{ flex:1; min-width:0; font-size:14px; line-height:1.45; }
  .rigaTitolo{ font-weight:700; }
  .rigaTitolo .via{ color:var(--link); text-decoration:underline; font-weight:400; }
  .rigaEnti{ color:var(--mut); font-size:13px; margin-top:2px; }
  .rigaStato{ margin-top:4px; font-size:12px; color:var(--mut); }
  .rigaStato b{ color:var(--txt); }
  .mezzi{ margin:6px 0 0; border-top:1px solid #e3e9ee; }
  .mz{ display:flex; align-items:center; gap:8px; padding:5px 0;
    border-bottom:1px solid #eef2f5; font-size:13px; }
  .mz:last-child{ border-bottom:0; }
  .mz .amb{ font-size:19px; }
  .mz .amb img{ height:22px; vertical-align:middle; }
  .mz .nome{ font-weight:700; }
  .mz .tipo{ font-size:11px; font-weight:800; padding:0 6px; border-radius:10px;
    background:#eef2f5; color:var(--mut); white-space:nowrap; }
  .mz .tipo.msb{ background:#e3ecfb; color:#0645ad; }
  .mz .tipo.msa{ background:#fde7e5; color:#d00000; }
  .mz .tipo.vvf{ background:#e4eaee; color:#4d5862; }
  .trDot{ display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; font-size:10px; font-weight:900;
    color:#fff; flex:none; }
  .trDot.ROSSO{ background:var(--red); }
  .trDot.GIALLO{ background:var(--yel); }
  .trDot.VERDE{ background:var(--grn); }
  .trDot.BIANCO{ background:#9aa7b2; }
  .mz .cod{ color:var(--mut); font-family:monospace; font-size:12px; }
  .mz .osp{ font-size:10px; color:var(--mut); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:220px; }
  .mz .st{ margin-left:auto; font-size:11px; font-weight:700; white-space:nowrap; }
  .mz .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
  .stato-pill{ display:inline-block; font-size:11px; font-weight:700; padding:1px 8px;
    border-radius:12px; margin-left:6px; vertical-align:middle; }
  .stato-pill.attiva{ background:#fde7e5; color:var(--red); }
  .stato-pill.in_corso{ background:#fef3d8; color:#8a6100; }
  .stato-pill.chiusa{ background:#e4eaee; color:var(--mut); }
  .centro{ text-align:center; color:var(--mut); padding:40px 10px; font-size:15px; }
  .errore{ background:#fde7e5; border:1px solid var(--red); border-radius:6px;
    padding:14px; margin-bottom:10px; font-size:14px; }
.errore button{ background:var(--areu); color:#fff; border:0; border-radius:6px;
    padding:8px 16px; font-size:14px; cursor:pointer; margin-top:8px; }
  .errore ol{ margin:8px 0 8px 20px; padding:0; }
  .errore li{ margin:4px 0; }
  .errore details{ margin-top:8px; font-size:13px; }
  .errore code{ display:block; margin-top:4px; padding:8px; background:#fff;
    border:1px solid #e3b7b4; border-radius:6px; word-break:break-all; }
  .setup{ margin-top:10px; background:#fff; border:1px solid #c9d4de;
    border-radius:6px; padding:10px; color:var(--txt); }
  .setup label{ display:block; font-size:13px; font-weight:700; margin:8px 0 4px; }
  .setup input{ width:100%; border:1px solid #9fb0bf; border-radius:6px;
    padding:8px 10px; font-size:14px; }
  .setup .riga{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .setup .nota{ font-size:12px; color:var(--mut); margin-top:8px; }
  .setup .stato{ font-size:13px; margin-top:8px; min-height:18px; }
footer{ color:var(--mut); font-size:12px; text-align:center; padding:20px; }
  footer a{ color:var(--link); }
  .spinner{ width:34px; height:34px; border:4px solid #b9c6d2; border-top-color:var(--areu);
    border-radius:50%; margin:30px auto 10px; animation:gira 0.9s linear infinite; }
  @keyframes gira{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <button class="hamb" id="hambBtn" title="Menu">☰</button>
      <div class="logo">
        <span class="name">🚨 Simulatore Emergenze</span>
      </div>
      <button class="searchbtn" id="searchBtn" title="Cerca">🔍</button>
    </div>
    <div class="toolbar" id="toolbar">
      <input id="cerca" type="search" placeholder="🔍 Cerca tipologia, luogo, comune…" autocomplete="off">
      <select id="filtroStato">
        <option value="attive">Aperte (attive + in corso)</option>
        <option value="tutte">Tutte quelle di oggi</option>
        <option value="attiva">Solo attive</option>
        <option value="in_corso">Solo in corso</option>
        <option value="chiusa">Solo chiuse</option>
      </select>
      <button id="cfgBtn" type="button" title="Configura connessione">⚙️ Connessione</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="statoRiga">Connessione in corso… <span id="conto"></span></div>
  <div class="layout">
  <aside class="side" id="latoSX"></aside>
  <div class="feed">
  <div id="errBox" class="errore" hidden></div>
  <div id="caricamento"><div class="spinner"></div><div class="centro">Caricamento missioni…</div></div>
  <div id="griglia"></div>
  <div id="vuoto" class="centro" hidden>Nessuna missione pubblicata al momento. 🚑</div>
  </div>
  <aside class="side sideR" id="latoDX"></aside>
  </div>
</main>
<footer>Solo lettura — i dati si aggiornano da soli. <a href="index.html">Apri il simulatore</a></footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  // >>>>>>>>>>> CONFIG — INCOLLA QUI I TUOI 2 VALORI (gli stessi del simulatore) >>>>>>>>>>>
  var SUPABASE_URL = "https://INSERISCI-IL-TUO-PROJECT-URL.supabase.co";
  var SUPABASE_ANON_KEY = "INCOLLA-QUI-LA-TUA-PUBLISHABLE-KEY";
  // >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
  // Usa SOLO Project URL + Publishable key. MAI password o chiavi riservate.

  var POLL_MS = 20000, LIMITE = 100;
  // ===== Meteo sul territorio (reale di Milano, Open-Meteo, senza chiavi) =====
  var METEO_WMO_LIVE = {0:["Sereno","☀️"],1:["Prevalentemente sereno","🌤️"],2:["Parzialmente nuvoloso","⛅"],3:["Coperto","☁️"],45:["Nebbia","🌫️"],48:["Nebbia con brina","🌫️❄️"],51:["Pioviggine debole","🌦️"],53:["Pioviggine moderata","🌦️"],55:["Pioviggine intensa","🌧️"],56:["Pioviggine gelata debole","🌧️❄️"],57:["Pioviggine gelata intensa","🌧️🧊"],61:["Pioggia debole","🌧️"],63:["Pioggia moderata","🌧️"],65:["Pioggia intensa","🌧️💧"],66:["Pioggia gelata debole","🌧️❄️"],67:["Pioggia gelata intensa","🌧️🧊"],71:["Neve debole","🌨️"],73:["Neve moderata","🌨️"],75:["Neve intensa","❄️"],77:["Granuli di neve","🌨️"],80:["Rovesci deboli","🌦️"],81:["Rovesci moderati","🌧️"],82:["Rovesci violenti","⛈️"],85:["Rovesci di neve deboli","🌨️"],86:["Rovesci di neve intensi","❄️🌨️"],95:["Temporale","⛈️"],96:["Temporale con grandine","⛈️🧊"],99:["Temporale con grandine intensa","⛈️🌨️"]};
  var meteoLive = { emoji: "🌡️", txt: "rilevamento in corso…" };
  function meteoLiveDaCodice(code, vento, temp){
    var w = METEO_WMO_LIVE[+code];
    var base = w ? w[0] : null;
    if(!base) return null;
    var v = +vento, t = +temp;
    if((base === "Temporale" || base === "Temporale con grandine" || base === "Temporale con grandine intensa") && isFinite(v) && v >= 60) return "Tromba d'aria";
    var cielo = (base === "Sereno" || base === "Prevalentemente sereno" || base === "Parzialmente nuvoloso" || base === "Coperto");
    if(cielo && isFinite(v) && v >= 30) return "Vento forte";
    if(isFinite(t) && t <= 0){
      if(base === "Pioviggine debole" || base === "Pioviggine moderata") return "Pioggia gelata debole";
      if(cielo) return "Gelo";
    }
    return base;
  }
  function meteoLiveEmoji(cond){
    if(cond === "Vento forte") return "🌬️";
    if(cond === "Tromba d'aria") return "🌪️";
    if(cond === "Gelo") return "🥶";
    for(var k in METEO_WMO_LIVE){ if(METEO_WMO_LIVE[k][0] === cond) return METEO_WMO_LIVE[k][1]; }
    return "🌡️";
  }
  function pannelloMeteo(){
    return '<div class="pannello"><h3>🌍 Meteo sul territorio</h3>' +
      '<div style="text-align:center"><div id="meteoLiveEmoji" style="font-size:44px;line-height:1.2">' + meteoLive.emoji + "</div>" +
      '<div class="sub" id="meteoLiveTxt">' + esc(meteoLive.txt) + "</div></div></div>";
  }
  function aggiornaMeteoLive(){
    fetch("https://api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.19&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FRome")
      .then(function(r){ return r.json(); })
      .then(function(j){
        var cur = j && j.current;
        if(!cur || !isFinite(+cur.temperature_2m)) return;
        var cond = meteoLiveDaCodice(cur.weather_code, cur.wind_speed_10m, cur.temperature_2m) || "Coperto";
        meteoLive = { emoji: meteoLiveEmoji(cond), txt: cond + ", " + Math.round(+cur.temperature_2m) + " °C · Milano" };
        var e1 = $("meteoLiveEmoji"), e2 = $("meteoLiveTxt");
        if(e1) e1.textContent = meteoLive.emoji;
        if(e2) e2.textContent = meteoLive.txt;
      })
      .catch(function(){ /* resta l'ultimo valore noto */ });
  }
  var righe = [], righe48 = [], canale = null, client = null, pronte = false;

  var LS_CFG = "coeulive_config"; // configurazione solo su questo browser

  function leggiCfgSalvata(){
    try{
      var cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null");
      if(cfg && typeof cfg.url === "string" && typeof cfg.key === "string"){
        return { url: cfg.url, key: cfg.key };
      }
    }catch(_){}
    return { url: "", key: "" };
  }

  function salvaCfg(url, key){
    try{ localStorage.setItem(LS_CFG, JSON.stringify({ url: url, key: key })); }
    catch(_){}
  }

  function pulisciCfg(){
    try{ localStorage.removeItem(LS_CFG); }
    catch(_){}
  }

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function statoIT(s){
    return s === "attiva" ? "ATTIVA" : s === "in_corso" ? "IN CORSO" : s === "chiusa" ? "CHIUSA" : String(s).toUpperCase();
  }
  function oraHM(ts){
    try{
      var d = new Date(ts);
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }catch(_){ return "--:--"; }
  }
  function quando(ts){
    try{
      var d = new Date(ts), now = new Date(), diff = Math.max(0, now - d);
      var m = Math.floor(diff / 60000);
      if(m < 1) return "adesso";
      if(m < 60) return m + " min fa";
      if(d.toDateString() === now.toDateString()) return "oggi " + oraHM(ts);
      return d.toLocaleDateString("it-IT") + " " + oraHM(ts);
    }catch(_){ return ""; }
  }
  function durataIT(da, a){
    try{
      var ms = Math.max(0, new Date(a) - new Date(da));
      var m = Math.floor(ms / 60000);
      if(m < 1) return "meno di 1 min";
      if(m < 60) return m + " min";
      var h = Math.floor(m / 60);
      if(h < 24) return h + " h " + (m % 60) + " min";
      return Math.floor(h / 24) + " g " + (h % 24) + " h";
    }catch(_){ return ""; }
  }
  function origineBadge(o){
    return o === "ia" ? ' <span title="Generata e gestita dalla centrale IA autonoma">🤖</span>' : "";
  }
  // true se la riga è di OGGI (giorno di calendario, ora locale); senza data valida resta visibile
  function diOggi(r){
    try{
      var d = new Date((r && r.created_at) || "");
      if(!isFinite(d.getTime())) return true;
      var o = new Date();
      return d.getFullYear() === o.getFullYear() && d.getMonth() === o.getMonth() && d.getDate() === o.getDate();
    }catch(_){ return true; }
  }
  // true se la riga è delle ultime 48 ore; senza data valida resta dentro
  function nelle48h(r){
    try{
      var d = new Date((r && r.created_at) || "");
      if(!isFinite(d.getTime())) return true;
      return (Date.now() - d.getTime()) <= 48 * 3600 * 1000;
    }catch(_){ return true; }
  }
  function cronologiaHTML(cr){
    var arr = [];
    if(Array.isArray(cr)) arr = cr;
    else { try{ arr = JSON.parse(cr || "[]"); }catch(_){ arr = []; } }
    if(!arr.length) return "";
    var items = arr.slice(-30).map(function(e){
      var t = "", x = "";
      if(e && typeof e === "object"){ t = e.t ? oraHM(e.t) + " " : ""; x = e.e || ""; }
      else x = String(e);
      return "<div>• <b>" + esc(t) + "</b>" + esc(x) + "</div>";
    }).join("");
    return '<details style="margin-top:4px;font-size:12px;color:var(--mut)"><summary style="cursor:pointer">🕘 Cronologia (' + arr.length + ")</summary>" + items + "</details>";
  }

  function urlPulita(){
    var u = String(SUPABASE_URL || "").trim();
    while(u.slice(-1) === "/") u = u.slice(0, -1);
    return u;
  }

  function hostContattato(){
    try{ return new URL(urlPulita()).hostname; }
    catch(_){ return ""; }
  }

  function erroreDiRete(msg){
    var t = String(msg || "");
    return t.indexOf("Failed to fetch") >= 0 ||
      t.indexOf("NetworkError") >= 0 ||
      t.indexOf("Load failed") >= 0 ||
      t.indexOf("ERR_") >= 0;
  }

  function statoMezzoIT(s){
    var m = { viaggio:"IN VIAGGIO", sul_posto:"SUL POSTO", pronto:"PRONTO",
      trasporto:"TRASPORTO", ospedale:"IN PS", rientro:"RIENTRO",
      disponibile:"LIBERO", fuori_servizio:"FUORI SERVIZIO" };
    return m[s] || String(s || "?").toUpperCase();
  }
  function dotMezzo(s){
    if(s === "sul_posto" || s === "pronto" || s === "trasporto") return "#d52b1e";
    if(s === "viaggio") return "#f5a800";
    if(s === "ospedale") return "#7a00c0";
    return "#9aa7b2";
  }
  function trasportoDaCodice(cod){
    if(cod === "ROSSO") return "R";
    if(cod === "GIALLO") return "G";
    if(cod === "VERDE") return "V";
    if(cod === "BIANCO") return "B";
    return "";
  }
  function iconaMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    var cat = String((v && v.cat) || "").toUpperCase();
    if(t === "ELI") return '<img src="https://user.uploads.dev/file/7e836fc9a694f41cdc652960e2d05569.gif" alt="🚁">';
    if(t === "AUTOMEDICA" || t === "MSA") return '<img src="https://user.uploads.dev/file/56de311743a246030d8b056afd9fd5d6.gif" alt="🚓">';
    if(t === "CNSAS") return "⛰️";
    if(cat === "VVF" || t === "VVF") return "🚒";
    if(t === "MSB") return "🚑";
    return (v && v.tr) ? "🚑" : "🚓";
  }
  function tipoMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    if(t) return t;
    var cat = String((v && v.cat) || "").toUpperCase();
    if(cat === "VVF") return "VVF";
    if(cat === "AMBULANZA") return "MSB";
    if(cat === "MSI_MSA") return "MSA";
    return "?";
  }
  function classeTipoMezzo(v){
    var t = String((v && v.t) || "").toUpperCase();
    if(t === "MSB") return "msb";
    if(t === "MSA" || t === "AUTOMEDICA" || t === "ELI") return "msa";
    if(String((v && v.cat) || "").toUpperCase() === "VVF") return "vvf";
    return "";
  }
  function mezziHTML(mz, cod, chiusa){
    var arr = [];
    if(Array.isArray(mz)) arr = mz;
    else { try{ arr = JSON.parse(mz || "[]"); }catch(_){ arr = []; } }
    if(!arr.length) return "";
    var trCod = trasportoDaCodice(cod);
    return '<div class="mezzi">' + arr.map(function(v){
      var inTrasporto = v.s === "trasporto" || v.s === "ospedale";
      // il bollino segue il codice del PAZIENTE trasportato (triage), mai quello della missione
      var pazCod = String((v && v.tpaz) || "").toUpperCase();
      var pazCls = ["ROSSO","GIALLO","VERDE","BIANCO"].indexOf(pazCod) >= 0 ? pazCod : "";
      var pazLet = trasportoDaCodice(pazCls);
      var isVVF = String((v && v.t) || "").toUpperCase() === "VVF" || String((v && v.cat) || "").toUpperCase() === "VVF";
      return '<div class="mz"><span class="amb">' + iconaMezzo(v) + "</span>" +
        '<span class="nome">' + esc(v.n || "?") + '</span>' +
        (isVVF ? "" : '<span class="tipo ' + classeTipoMezzo(v) + '">' + esc(tipoMezzo(v)) + "</span>") +
        ((v.tr && pazLet && (inTrasporto || chiusa)) ? '<span class="trDot ' + pazCls + '" title="Codice di trasporto del paziente: ' + esc(pazCod) + '"></span>' : "") +
        (v.osp ? '<span class="osp" title="' + esc(v.osp) + '">H ' + esc(String(v.osp).replace(/^(Osp\. di |Osp\. |Ospedale )/i, "")) + '</span>' : "") +
        ((isVVF || !(v.c && v.c !== v.n)) ? "" : '<span class="cod">' + esc(v.c) + "</span>") +
        '<span class="st">' + esc(statoMezzoIT(v.s)) + "</span></div>";
    }).join("") + "</div>";
  }

  function disegna(){
    var q = ($("cerca").value || "").toLowerCase();
    var f = $("filtroStato").value;
    var vis = righe.filter(function(r){
      if(f === "attive" && !(r.stato === "attiva" || r.stato === "in_corso")) return false;
      if(f !== "attive" && f !== "tutte" && r.stato !== f) return false;
      if(!q) return true;
      return ((r.tipologia || "") + " " + (r.localita || "") + " " + (r.comune || "")).toLowerCase().indexOf(q) >= 0;
    });
    var aperte = righe.filter(function(r){ return r.stato === "attiva" || r.stato === "in_corso"; }).length;
    $("conto").textContent = "· " + aperte + " aperte · aggiornato " + new Date().toLocaleTimeString("it-IT");
    $("vuoto").hidden = vis.length > 0;
    $("griglia").innerHTML = vis.map(function(r){
      var st = r.stato === "in_corso" ? "in_corso" : r.stato;
      var luogo = (r.comune || "").toUpperCase() + (r.provincia ? " (" + esc(r.provincia) + ")" : "");
      var via = esc(r.localita || "?");
      var cod = String(r.codice || "SENZA CODICE").toUpperCase();
      var codCls = ["ROSSO","GIALLO","VERDE","BIANCO"].indexOf(cod) >= 0 ? cod : "SENZA";
      var fine = (r.stato === "chiusa" && (r.chiusa_il || r.updated_at)) ? (r.chiusa_il || r.updated_at) : new Date().toISOString();
      var dur = r.created_at ? durataIT(r.created_at, fine) : "";
      var descr = (r.origine === "ia" || !r.descrizione) ? "" : '<div class="rigaEnti">' + esc(r.descrizione) + "</div>";
      var eta = "";
      try {
        var parr = Array.isArray(r.pazienti) ? r.pazienti : JSON.parse(r.pazienti || "[]");
        var pp = parr.filter(function(p){ return p && (p.sx === "M" || p.sx === "F") && p.e !== "?" && p.e != null; })
          .map(function(p){ return p.sx + " " + p.e; });
        if (pp.length) {
          var sulPosto = r.stato === "chiusa" || listaMezzi(r).some(function(v){
            return v && (v.s === "sul_posto" || v.s === "pronto" || v.s === "trasporto" || v.s === "ospedale");
          });
          if (sulPosto) eta = '<div class="rigaEnti">👤 ' + esc(pp.join(" · ")) + "</div>";
        }
      } catch (_) {}
      return '<article class="card">' +
        '<div class="badge cod-' + codCls + '" title="Codice di invio: ' + esc(cod) + '">✳</div>' +
        '<div class="cardBody">' +
        '<div class="rigaTitolo">' + esc(oraHM(r.created_at || r.updated_at)) + " " + esc(luogo) + " - " + esc((r.tipologia || "?").toUpperCase()) + ' - <span class="via">' + via + "</span>" +
        '<span class="stato-pill ' + esc(st) + '">' + esc(statoIT(r.stato)) + "</span>" + origineBadge(r.origine) + "</div>" +
        descr +
        eta +
        mezziHTML(r.mezzi, codCls === "SENZA" ? "SENZA CODICE" : codCls, r.stato === "chiusa" && r.origine === "ia") +
        cronologiaHTML(r.cronologia) +
        '<div class="rigaEnti">🕐 ' + esc(quando(r.updated_at)) + " · ⏱ " + esc(dur) + " · #" + esc(r.missione_id) + "</div>" +
        "</div></article>";
    }).join("");
    aggiornaLati();
  }

  var TOP11 = ["🩺 Malori", "🚗 Incidenti stradali", "🔥 Incendi", "🤕 Cadute", "🩹 Infortunio", "👥 Eventi di massa", "🌪️ Calamità naturali", "☠️ Intossicazione", "⛰️ Incidente in montagna", "🚨 Maxiemergenze", "💥 Maxi-incidenti"];
  function gruppoTop(tip, numPaz){
    var n = String(tip || "").toLowerCase();
    var np = +numPaz || 0;
    if(np >= 10) return TOP11[9];
    if(np >= 5) return TOP11[10];
    if(/incendio|incendi|fuoco|fiamme|rogo|esplosione|esplode|brucia|ustione/.test(n)) return TOP11[2];
    if(/amputa|anneg|ferita|folgor|fulmine|incastr|ribaltamento/.test(n)) return TOP11[4];
    if(/crollo|crolla|fuga di gas|fuga gas|nube tossica|nucleare|schiacciamento|calca/.test(n)) return TOP11[5];
    if(/esondazione|frana|nubifragio|terremoto|tromba|valanga/.test(n)) return TOP11[6];
    if(/intossica|avvelen|overdose|etilic|monossido|farmac/.test(n)) return TOP11[7];
    if(/caduta|caduto|scivola|scivolone|inciamp|precipit|dirupo|scarpata|burrone/.test(n)) return TOP11[3];
    if(/sciator|snowboard|slittin|ferrata|falesia|rifugio|funivia|seggiovia|cabinovia|alpeggio|all'alpe|malga|baita|vetta|cresta|parete|cordata|bivacco|ghiacciaio|crepaccio|seracco|morena|nevaio|bufera|tormenta|valico|mulattiera|forra|grotta|speleo|motoslitta|\bsci\b/.test(n) && !/sci nautico|pattini|tenda|monopattino|motosega/.test(n)) return TOP11[8];
    if(/malore|infarto|ictus|arresto|sincope|lipotimia|svenimento|collasso|coma|toracico|dispnea|dolore|febbre|vomito|nausea|vertigin|emicrania|panico|ansia|psich|parto|gravid|diabet|ipertens|aritmia|palpit|asma|convuls|epiless|shock anafil|colica|reazione allerg|trasporto|dialisi|calo di|pressione|insufficienza|lomb|soffocamento|boccone|crisi/.test(n)) return TOP11[0];
    if(/scontro|tamponamento|tampona|investi|frontale|schianto|ribalta|fuori strada|uscita di strada|stradale|contro |carambola|svincolo|rotatoria|guardrail|spartitraffico|tir\b|camion|autoarticolato|monopattino|bicicletta|pedone|furgone|\bmoto\b|\bauto\b|veicolo|automobile/.test(n) && !/moto d'acqua|motoslitta|motosega|pedal[oò]|sup\b|piscina|in acqua|nel lago|parto in auto|malore alla guida|alla guida/.test(n)) return TOP11[1];
    return null;
  }
  function listaMezzi(r){
    try { return Array.isArray(r.mezzi) ? r.mezzi : JSON.parse(r.mezzi || "[]"); }
    catch (_) { return []; }
  }
  function listaPaz(r){
    try { var a = Array.isArray(r.pazienti) ? r.pazienti : JSON.parse(r.pazienti || "[]"); return Array.isArray(a) ? a : []; }
    catch (_) { return []; }
  }
  function aggiornaLati(){
    var cor = 0, chi = 0, nMSB = 0, nVVF = 0, nELI = 0, nMSA = 0;
    var cR = 0, cG = 0, cV = 0; // missioni di oggi per codice
    var visti = {}; // codice mezzo -> già contato (un mezzo uscito 2 volte conta 1)
    righe.forEach(function(r){
      if(r.stato === "attiva" || r.stato === "in_corso") cor++;
      else if(r.stato === "chiusa") chi++;
      var cd = String(r.codice || "").toUpperCase();
      if(cd === "ROSSO") cR++; else if(cd === "GIALLO") cG++; else if(cd === "VERDE") cV++;
      var mz = listaMezzi(r);
      // tutti i mezzi usciti oggi, anche dalle chiuse: niente gate su stato riga/mezzo
      mz.forEach(function(v){
        var cod = String((v && (v.c || v.n)) || "");
        if(!cod || visti[cod]) return;
        visti[cod] = true;
        var t = String((v && v.t) || "").toUpperCase();
        var cat = String((v && v.cat) || "").toUpperCase();
        if(t === "ELI") nELI++;
        else if(t === "VVF" || cat === "VVF") nVVF++;
        else if(t === "CNSAS") { /* soccorso alpino: icona propria, fuori dai conteggi */ }
        else if(t === "MSA" || t === "AUTOMEDICA" || cat === "MSI_MSA") nMSA++;
        else nMSB++;
      });
    });
    var sx = pannelloMeteo() + '<div class="pannello"><h3>📡 Oggi <small style="font-weight:normal">🔴 ' + cR + " 🟡 " + cG + " 🟢 " + cV + "</small></h3>" +
      '<div class="riga"><span>In corso</span><b>' + cor + "</b></div>" +
      '<div class="riga"><span>Chiuse</span><b>' + chi + "</b></div>" +
      '<div class="riga"><span>🚑 mezzi 118</span><b>' + nMSB + "</b></div>" +
      '<div class="riga"><span>🚓 msa/msi</span><b>' + nMSA + "</b></div>" +
      '<div class="riga"><span>🚒 mezzi vvf</span><b>' + nVVF + "</b></div>" +
      '<div class="riga"><span>🚁 eli</span><b>' + nELI + "</b></div></div>";
    // pannelli di destra: finestra ultime 48 ore
    var top = {}; TOP11.forEach(function(k){ top[k] = 0; });
    var comp = null, best = -1, dec = 0, intVVF = 0, compV = null, bestV = -1, bestVtot = -1, ospCount = {};
    righe48.forEach(function(r){
      var mz = listaMezzi(r);
      var g = gruppoTop(r.tipologia, r.num_pazienti);
      if(g) top[g]++;
      var haVVF = mz.some(function(v){
        return String((v && v.t) || "").toUpperCase() === "VVF" ||
               String((v && v.cat) || "").toUpperCase() === "VVF";
      });
      if(haVVF) intVVF++;
      var nvv = 0, totvv = 0;
      mz.forEach(function(v){
        var t2 = String((v && v.t) || "").toUpperCase(), c2 = String((v && v.cat) || "").toUpperCase();
        if(t2 === "VVF" || c2 === "VVF"){ totvv++; if(v.s !== "rientro") nvv++; }
        var oo = v && v.osp;
        if(oo) ospCount[oo] = (ospCount[oo] || 0) + 1;
      });
      if(nvv > bestV || (nvv === bestV && totvv > bestVtot)){ bestV = nvv; bestVtot = totvv; compV = r; }
      var score = (+r.num_pazienti || 0) + mz.length;
      if(score > best){ best = score; comp = r; }
      listaPaz(r).forEach(function(p){ if(p && p.s !== null && p.s !== "" && +p.s <= 0) dec++; });
    });
    var topOsp = "", topOspN = 0;
    for(var ok in ospCount){ if(ospCount[ok] > topOspN){ topOspN = ospCount[ok]; topOsp = ok; } }
    if(compV && bestV > 0){
      var vvMz = listaMezzi(compV).filter(function(v){
        return (String((v && v.t) || "").toUpperCase() === "VVF" ||
                String((v && v.cat) || "").toUpperCase() === "VVF") && v.s !== "rientro";
      });
      var vvNomi = vvMz.map(function(v){ return iconaMezzo(v) + " " + esc((v && v.n) || "?"); });
      sx += '<div class="pannello"><h3>🚒🚒 intervento con più mezzi VVF 48h</h3>' +
        '<div class="comp">' + esc((compV.tipologia || "?").toUpperCase()) + "</div>" +
        '<div class="sub">' + esc((compV.comune || "") + (compV.provincia ? " (" + compV.provincia + ")" : "")) + " · " +
        bestV + " mezzi VVF</div>" +
        (vvNomi.length ? '<div class="sub">' + vvNomi.join("<br>") + "</div>" : "") + "</div>";
    }
    $("latoSX").innerHTML = sx;
    var t = '<div class="pannello"><h3>🏆 Top tipologie 48h</h3>' +
      TOP11.map(function(k){ return '<div class="riga"><span>' + k + "</span><b>" + top[k] + "</b></div>"; }).join("") + "</div>";
    if(comp){
      var compChiusa = comp.stato === "chiusa";
      var mrighe = listaMezzi(comp).map(function(v){
        var dot = "";
        var pc = String((v && v.tpaz) || "").toUpperCase();
        var inTr = v && (v.s === "trasporto" || v.s === "ospedale");
        var noVVF = String((v && v.t) || "").toUpperCase() !== "VVF" &&
                    String((v && v.cat) || "").toUpperCase() !== "VVF";
        if(noVVF && v && v.tr && ["ROSSO","GIALLO","VERDE","BIANCO"].indexOf(pc) >= 0 && (inTr || compChiusa))
          dot = ' <span class="trDot ' + pc + '"></span>';
        return iconaMezzo(v) + " " + esc((v && v.n) || "?") + dot;
      });
      t += '<div class="pannello"><h3>🚓🚑🚒 intervento con più mezzi 48h</h3>' +
        '<div class="comp">' + esc((comp.tipologia || "?").toUpperCase()) + "</div>" +
        '<div class="sub">' + esc((comp.comune || "") + (comp.provincia ? " (" + comp.provincia + ")" : "")) + " · " +
        (+comp.num_pazienti || 0) + " pazienti · " + listaMezzi(comp).length + " mezzi</div>" +
        (mrighe.length ? '<div class="sub">' + mrighe.join("<br>") + "</div>" : "") + "</div>";
    }
    if(topOsp){
      var ospBreve = String(topOsp).replace(/^(Osp\. di |Osp\. |Ospedale )/i, "");
      t += '<div class="pannello"><h3>🏥 PS più usata 48h</h3>' +
        '<div class="comp">' + esc(ospBreve) + "</div>" +
        '<div class="sub">' + topOspN + " trasporti</div></div>";
    } else {
      t += '<div class="pannello"><h3>🕊️ Decessi registrati</h3><b style="font-size:18px">' + dec + "</b></div>";
    }
    t += '<div class="pannello"><h3>🚒 INTERVENTI VVF</h3><b style="font-size:18px">' + intVVF + "</b></div>";
    $("latoDX").innerHTML = t;
  }

  function mostraErrore(msg, riprova){
    var b = $("errBox");
    b.hidden = false;
    b.innerHTML = "⚠️ <b>Problema di connessione.</b><br>" + esc(msg) +
      (riprova ? '<br><button id="riprovaBtn">🔄 Riprova ora</button>' : "");
    var btn = $("riprovaBtn");
    if(btn) btn.onclick = function(){ b.hidden = true; ricarica(); };
  }

  function mostraSetup(){
    var b = $("errBox");
    var salvata = leggiCfgSalvata();
    var urlIn = salvata.url ||
      (SUPABASE_URL.indexOf("INSERISCI-IL-TUO") < 0 ? SUPABASE_URL : "");
    var keyIn = salvata.key ||
      (SUPABASE_ANON_KEY.indexOf("INCOLLA-QUI") < 0 ? SUPABASE_ANON_KEY : "");
    b.hidden = false;
    b.innerHTML = "⚠️ <b>Connessione da configurare su questo browser.</b><br>" +
      "Incolla qui i due valori del tuo progetto Supabase. Restano salvati solo su questo dispositivo." +
      '<div class="setup">' +
      '<label for="cfgUrl">Project URL</label>' +
      '<input id="cfgUrl" type="text" autocomplete="off" spellcheck="false" placeholder="https://xxxx.supabase.co">' +
      '<label for="cfgKey">Publishable key</label>' +
      '<input id="cfgKey" type="password" autocomplete="off" spellcheck="false" placeholder="sb_publishable_...">' +
      '<div class="riga"><button id="cfgSaveBtn" type="button">💾 Salva e connetti</button>' +
      '<button id="cfgClearBtn" type="button">🧹 Cancella</button></div>' +
      '<div class="stato" id="cfgStato"></div>' +
      '<div class="nota">Non usare password né chiavi che iniziano con <b>sb_secret_</b>.</div>' +
      "</div>";
    var urlEl = $("cfgUrl"), keyEl = $("cfgKey"), statoEl = $("cfgStato");
    urlEl.value = urlIn;
    keyEl.value = keyIn;
    $("cfgSaveBtn").onclick = function(){
      var url = String(urlEl.value || "").trim();
      while(url.slice(-1) === "/") url = url.slice(0, -1);
      var key = String(keyEl.value || "").trim();
      if(!url || !key){
        statoEl.textContent = "Inserisci entrambi i valori e riprova.";
        return;
      }
      if(url.indexOf("sb_secret_") >= 0 || key.indexOf("sb_secret_") === 0){
        statoEl.textContent = "Hai incollato una chiave riservata sb_secret_: usa la Publishable key.";
        return;
      }
      try{
        var u = new URL(url);
        if(u.protocol !== "https:" || u.hostname.toLowerCase().indexOf(".supabase.co") < 0){
          throw new Error("URL non valido");
        }
      }catch(_){
        statoEl.textContent = "Project URL non valido: deve essere https://xxxx.supabase.co.";
        return;
      }
      salvaCfg(url, key);
      statoEl.textContent = "Salvato. Connessione in corso…";
      b.hidden = true;
      avvia();
    };
    $("cfgClearBtn").onclick = function(){
      pulisciCfg();
      urlEl.value = "";
      keyEl.value = "";
      statoEl.textContent = "Configurazione cancellata da questo browser.";
    };
  }

  function mostraErroreRete(msg){
    var b = $("errBox");
    var host = hostContattato();
    var hostTxt = host ? esc(host) : "l’indirizzo configurato";
    var hostHref = host ? esc("https://" + host) : "#";
    b.hidden = false;
    b.innerHTML = "⚠️ <b>La pagina non riesce a raggiungere " + hostTxt + ".</b><br>" +
      "Il gioco non è toccato. Controlla questi punti, in ordine:" +
      "<ol>" +
      "<li><b>Project URL</b>: deve essere simile a <b>https://xxxx.supabase.co</b>, senza spazi, senza <b>/rest/v1</b> e senza chiavi dentro l’indirizzo.</li>" +
      "<li><b>Publishable key</b>: di solito inizia con <b>sb_publishable_</b>. Non usare mai una chiave che inizia con <b>sb_secret_</b>: è riservata e non va nel browser.</li>" +
      "<li>Apri il progetto nel browser: <a href=\"" + hostHref + "\" target=\"_blank\" rel=\"noopener\">" + hostTxt + "</a>. Se non si apre, il progetto può essere sbagliato, in pausa oppure la rete lo blocca.</li>" +
      "<li>Prova un’altra rete o un altro browser e, se usi VPN/ad-block/firewall aziendale, disattivalo per un minuto e riprova.</li>" +
      "</ol>" +
      "<details><summary>Dettaglio tecnico</summary><code>" + esc(String(msg || "errore di rete").slice(0, 300)) + "</code></details>" +
      '<br><button id="riprovaBtn">🔄 Riprova ora</button>';
    var btn = $("riprovaBtn");
    if(btn) btn.onclick = function(){ b.hidden = true; ricarica(); };
  }

  async function ricarica(){
    if(!client) return;
    try{
      var q = client.from("missioni_live")
        .select("missione_id,tipologia,descrizione,localita,comune,provincia,num_pazienti,pazienti,stato,codice,mezzi,cronologia,origine,created_at,updated_at,chiusa_il")
        .eq("pubblica", true)
        .order("updated_at", { ascending: false })
        .limit(LIMITE);
      var res = await q;
      if(res.error) throw res.error;
      // solo oggi: a mezzanotte il tabellone riparte da zero (tabella + pannello OGGI);
      // i pannelli di destra lavorano sulle ultime 48 ore
      righe = (res.data || []).filter(diOggi);
      righe48 = (res.data || []).filter(nelle48h);
      pronte = true;
      $("caricamento").hidden = true;
      disegna();
    }catch(e){
      var msg = String((e && e.message) || e);
      $("caricamento").hidden = true;
      if(erroreDiRete(msg)) mostraErroreRete(msg);
      else mostraErrore("impossibile caricare le missioni (" + msg.slice(0, 180) + "). Il gioco non è toccato: riprova tra poco.", true);
    }
  }

  function avvia(){
    var salvata = leggiCfgSalvata();
    if(salvata.url && salvata.key){
      SUPABASE_URL = salvata.url;
      SUPABASE_ANON_KEY = salvata.key;
    }
    SUPABASE_URL = urlPulita();
    SUPABASE_ANON_KEY = String(SUPABASE_ANON_KEY || "").trim();
    if(SUPABASE_URL.indexOf("INSERISCI-IL-TUO") >= 0 || SUPABASE_ANON_KEY.indexOf("INCOLLA-QUI") >= 0){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    if(SUPABASE_URL.indexOf("sb_secret_") >= 0 || SUPABASE_ANON_KEY.indexOf("sb_secret_") === 0){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    if(!window.supabase || !window.supabase.createClient){
      $("caricamento").hidden = true;
      mostraErrore("libreria Supabase non caricata: serve la connessione a internet (unpkg.com).", true);
      return;
    }
    try{
      var u = new URL(SUPABASE_URL);
      if(u.protocol !== "https:" || u.hostname.toLowerCase().indexOf(".supabase.co") < 0){
        throw new Error("URL non valido");
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(e){
      $("caricamento").hidden = true;
      mostraSetup();
      return;
    }
    ricarica();
    try{
      canale = client.channel("missioni-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "missioni_live" }, function(){ ricarica(); })
        .subscribe();
    }catch(_){ /* il polling sotto copre comunque gli aggiornamenti */ }
    setInterval(ricarica, POLL_MS); // rete di sicurezza se il Realtime salta
    aggiornaMeteoLive();
    setInterval(aggiornaMeteoLive, 600000); // meteo reale di Milano ogni 10 minuti
    $("cerca").addEventListener("input", disegna);
    $("filtroStato").addEventListener("change", disegna);
    $("cfgBtn").addEventListener("click", mostraSetup);
    $("searchBtn").addEventListener("click", function(){
      var t = $("toolbar");
      t.style.display = (t.style.display === "none") ? "flex" : "none";
      if(t.style.display !== "none") $("cerca").focus();
    });
    $("hambBtn").addEventListener("click", function(){
      var t = $("toolbar");
      t.style.display = (t.style.display === "none") ? "flex" : "none";
    });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", avvia);
  else avvia();
})();
</script>
</body>
